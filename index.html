<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCL Modern Live Overlay</title>
<style>
:root{
  --navy:#071a32;
  --navy2:#0b2e4b;
  --blue:#0e5b93;
  --cyan:#2aa3d6;
  --light:#f7f9fc;
  --ink:#0e2035;
  --muted:#52657b;
  --gold:#f1ad2b;
  --danger:#c93d4b;
}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;
  font-family:Arial,Helvetica,sans-serif
}
#brand{
  position:absolute; left:1.8vw; top:1.8vh;
  width:92px; height:92px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.94);
  border-radius:13px;
  padding:5px;
  box-sizing:border-box;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.28));
}
#brand img{
  width:100%; height:100%; object-fit:contain; border-radius:9px;
}
#overlay{
  position:absolute; left:1.4vw; right:1.4vw; bottom:1.2vh;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));
}
#err{
  display:none; margin-bottom:4px;
  background:#7f1d1d;color:#fff;padding:8px 10px;border-radius:8px;font-size:12px
}
.mainbar{
  height:58px;
  display:grid;
  grid-template-columns: 1.12fr 1fr 1.12fr;
  border-radius:10px 10px 0 0;
  overflow:hidden;
}
.side{
  background:rgba(248,250,253,.97);
  color:var(--ink);
  display:flex;align-items:center;gap:10px;
  padding:5px 10px;
}
.side.right{justify-content:flex-end}
.team-logo{
  width:42px;height:42px;border-radius:50%;
  object-fit:contain;background:white;border:1px solid #d8e0e8;padding:3px;box-sizing:border-box;flex:0 0 auto;
}
.player-block{min-width:0;flex:1}
.player-line{
  display:flex;align-items:baseline;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.player-name{
  font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.player-stat{
  font-size:12px;color:var(--muted);font-weight:800
}
.subline{
  margin-top:3px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.center-score{
  background:linear-gradient(135deg,var(--blue),#143c75);
  color:#fff;
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:9px;
  padding:5px 11px;
  border-left:2px solid rgba(255,255,255,.15);
  border-right:2px solid rgba(255,255,255,.15);
}
.center-team{
  font-size:18px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;
}
.score-stack{text-align:center}
.big-score{font-size:27px;font-weight:900;line-height:1}
.score-meta{font-size:11px;font-weight:800;color:#d8ecff;margin-top:2px}
.rate{
  text-align:right;font-size:11px;font-weight:800;color:#d8ecff;line-height:1.3
}
.infobar{
  min-height:25px;
  background:rgba(7,26,50,.98);
  color:white;
  display:grid;
  grid-template-columns:1.15fr 1.6fr 1.25fr;
  align-items:center;
  padding:0 9px;
  border-radius:0 0 10px 10px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.1px;
}
.info-left{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-mid{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-right{display:flex;justify-content:flex-end;align-items:center;gap:5px;overflow:hidden}
.ball{
  min-width:20px;height:20px;padding:0 4px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#e8eef4;color:#14263c;font-size:10px;font-weight:900
}
.ball.w{background:var(--danger);color:white}
.ball.boundary{background:var(--cyan);color:white}
.ball.extra{background:var(--gold);color:#1c2a3d}
.label{color:#9eb9d2;margin-right:2px}
@media(max-width:900px){
  .mainbar{height:54px}
  .team-logo{width:38px;height:38px}
  .center-team{font-size:15px}
  .big-score{font-size:23px}
  .player-name{font-size:12px}
  .infobar{font-size:10px}
}
</style>
</head>
<body>

<div id="brand">
  <img id="dclLogo"
       src="https://www.dallascricket.org/logo512.png"
       onerror="this.onerror=null;this.src='https://www.dallascricket.org/logo192.png';"
       alt="Dallas Cricket League">
</div>

<div id="overlay">
  <div id="err"></div>

  <div class="mainbar">
    <div class="side">
      <img id="batLogo" class="team-logo" alt="">
      <div class="player-block">
        <div class="player-line">
          <span id="b1name" class="player-name">Batter 1</span>
          <span id="b1stat" class="player-stat">0 (0)</span>
        </div>
        <div class="player-line">
          <span id="b2name" class="player-name">Batter 2</span>
          <span id="b2stat" class="player-stat">0 (0)</span>
        </div>
        <div id="battingTeamLabel" class="subline">Batting side</div>
      </div>
    </div>

    <div class="center-score">
      <div id="teamShort" class="center-team">TEAM</div>
      <div class="score-stack">
        <div id="mainScore" class="big-score">0/0</div>
        <div id="mainOvers" class="score-meta">OVERS 0.0</div>
      </div>
      <div class="rate">
        <div id="crr">CRR 0.00</div>
        <div id="rrr">RRR —</div>
      </div>
    </div>

    <div class="side right">
      <div class="player-block">
        <div class="player-line" style="justify-content:flex-end">
          <span id="bowlerName" class="player-name">Bowler</span>
          <span id="bowlerStat" class="player-stat">0/0 (0.0)</span>
        </div>
        <div id="bowlingTeamLabel" class="subline" style="text-align:right">Bowling side</div>
      </div>
      <img id="bowlLogo" class="team-logo" alt="">
    </div>
  </div>

  <div class="infobar">
    <div id="inningsContext" class="info-left">FIRST INNINGS</div>
    <div id="equation" class="info-mid">Match information loading…</div>
    <div class="info-right">
      <span class="label">THIS OVER</span>
      <span id="balls"></span>
    </div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const matchId = (qs.get('match') || '5923').replace(/[^0-9]/g,'');
const refreshMs = Math.max(2000, Number(qs.get('refresh') || 2000));
const apiUrl = `/.netlify/functions/score?match=${matchId}`;

function deepFind(obj,key){
  if(!obj || typeof obj !== 'object') return undefined;
  if(Object.prototype.hasOwnProperty.call(obj,key)) return obj[key];
  for(const v of Object.values(obj)){
    const f=deepFind(v,key);
    if(f!==undefined) return f;
  }
}
function parseDetails(raw){
  if(!raw) return {};
  if(typeof raw === 'object') return raw;
  try{return JSON.parse(raw)}catch{return {}}
}
function cleanName(s){ return (s||'').replace(/\s+/g,' ').trim(); }
function abbrev(name){
  const words=cleanName(name).split(' ').filter(Boolean);
  if(words.length===1) return words[0].slice(0,3).toUpperCase();
  return words.map(w=>w[0]).join('').slice(0,4).toUpperCase();
}
function logoUrl(path){ return path ? `/.netlify/functions/score?logo=${encodeURIComponent(path)}` : ''; }
function ballClass(v){
  const s=String(v).toLowerCase();
  if(s.includes('w')) return 'ball w';
  if(s==='4'||s==='6') return 'ball boundary';
  if(/[a-z]/.test(s)) return 'ball extra';
  return 'ball';
}
function ballsRemaining(overs,maxOvers=20){
  const ov=Number(overs||0);
  const whole=Math.floor(ov);
  const balls=Math.round((ov-whole)*10);
  return Math.max(0,maxOvers*6-(whole*6+balls));
}
function latestMatchHost(payload){
  if(payload && typeof payload==='object' && 'score_details' in payload) return payload;
  if(!payload || typeof payload!=='object') return payload;
  for(const v of Object.values(payload)){
    const f=latestMatchHost(v);
    if(f) return f;
  }
  return payload;
}

function render(payload){
  const host=latestMatchHost(payload)||payload;
  const details=parseDetails(host.score_details ?? deepFind(payload,'score_details'));
  const extra=details.extraDetails || host.extraDetails || deepFind(payload,'extraDetails') || {};
  const active=Number(details.activeInnings || host.activeInnings || deepFind(payload,'activeInnings') || 1);
  const i1=details.inning1||{};
  const i2=details.inning2||{};
  const activeInn=details[`inning${active}`]||{};

  const team1=extra.team1 || i1.teamName || 'Team 1';
  const team2=extra.team2 || i2.teamName || 'Team 2';
  const battingTeam = active===1 ? team1 : team2;
  const bowlingTeam = active===1 ? team2 : team1;

  const batLogoPath = active===1 ? extra.team1Logo : extra.team2Logo;
  const bowlLogoPath = active===1 ? extra.team2Logo : extra.team1Logo;

  document.getElementById('batLogo').src=logoUrl(batLogoPath||'');
  document.getElementById('bowlLogo').src=logoUrl(bowlLogoPath||'');
  document.getElementById('batLogo').style.display=batLogoPath?'block':'none';
  document.getElementById('bowlLogo').style.display=bowlLogoPath?'block':'none';

  const b1=activeInn.batter1||{};
  const b2=activeInn.batter2||{};
  document.getElementById('b1name').textContent = cleanName(b1.name)||'Batter 1';
  document.getElementById('b2name').textContent = cleanName(b2.name)||'Batter 2';
  document.getElementById('b1stat').textContent = `${b1.run??0}${b1.onStrike?'*':''} (${b1.ball??0})`;
  document.getElementById('b2stat').textContent = `${b2.run??0}${b2.onStrike?'*':''} (${b2.ball??0})`;
  document.getElementById('battingTeamLabel').textContent = battingTeam;

  const bow=activeInn.bowler||{};
  document.getElementById('bowlerName').textContent = cleanName(bow.name)||'Bowler';
  document.getElementById('bowlerStat').textContent = bow.name
    ? `${bow.wicket??0}/${bow.run??0} (${bow.over??0})`
    : '—';
  document.getElementById('bowlingTeamLabel').textContent = bowlingTeam;

  document.getElementById('teamShort').textContent=abbrev(battingTeam);
  document.getElementById('mainScore').textContent=`${activeInn.runs??0}/${activeInn.wickets??0}`;
  document.getElementById('mainOvers').textContent=`OVERS ${activeInn.overs??0}`;
  document.getElementById('crr').textContent=`CRR ${activeInn.runRate ?? '—'}`;

  const balls=document.getElementById('balls');
  balls.innerHTML='';
  const stack=activeInn.currentRunStack||[];
  stack.slice(-8).forEach(v=>{
    const el=document.createElement('span');
    el.className=ballClass(v);
    el.textContent=String(v).toUpperCase();
    balls.appendChild(el);
  });
  if(!stack.length) balls.textContent='—';

  const ctx=document.getElementById('inningsContext');
  const eq=document.getElementById('equation');
  const rrr=document.getElementById('rrr');

  const matchEnded = details.isMatchEnded ?? host.isMatchEnded ?? deepFind(payload,'isMatchEnded');
  const live = details.isLive ?? host.isLive ?? deepFind(payload,'isLive');

  if(active===1){
    ctx.textContent=`${team1.toUpperCase()} BATTING • 1ST INNINGS`;
    eq.textContent=`${bowlingTeam.toUpperCase()} BOWLING`;
    rrr.textContent='RRR —';
  } else {
    const target=(i1.runs??0)+1;
    const current=i2.runs??0;
    const need=Math.max(0,target-current);
    const left=ballsRemaining(i2.overs,20);
    const calcRrr=(left>0 && need>0)?(need/(left/6)).toFixed(2):'—';
    ctx.textContent=`${team1.toUpperCase()} ${i1.runs??0}/${i1.wickets??0} (${i1.overs??0})`;
    eq.textContent = extra.message || `TARGET ${target} • NEED ${need} FROM ${left} BALLS`;
    rrr.textContent=`RRR ${calcRrr}`;
  }

  if(matchEnded){
    eq.textContent=extra.message || 'MATCH COMPLETE';
  } else if(!live && extra.message){
    eq.textContent=extra.message;
  }

  document.getElementById('err').style.display='none';
}

async function load(){
  try{
    const r=await fetch(apiUrl,{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    render(await r.json());
  }catch(e){
    const er=document.getElementById('err');
    er.style.display='block';
    er.textContent='Unable to load DCL score: '+e.message;
  }
}
load();
setInterval(load,refreshMs);
</script>
</body>
</html>
