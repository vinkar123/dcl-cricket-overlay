<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Arial,sans-serif}
#brand{position:absolute;right:2vw;top:2vh;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.94);padding:7px 12px;border-radius:12px;color:#103c53;font-weight:900;filter:drop-shadow(0 3px 7px #0005)}
#brand img{width:48px;height:34px;object-fit:contain}
#wrap{position:absolute;left:2vw;right:2vw;bottom:2vh;filter:drop-shadow(0 3px 7px #0005)}
.ribbon{display:grid;grid-template-columns:1.2fr 1.2fr 1.6fr;min-height:94px;border-radius:13px 13px 0 0;overflow:hidden;color:#fff}
.team{background:rgba(5,24,57,.95);padding:10px 14px;display:flex;align-items:center;gap:12px}
.team.active{background:rgba(10,65,91,.97)}
.tlogo{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;box-sizing:border-box}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:0}
.name{font-size:19px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{text-align:right;white-space:nowrap}.main{font-size:29px;font-weight:900}.overs{font-size:14px;color:#c8d7e8;margin-top:4px;font-weight:700}
.match{background:linear-gradient(105deg,rgba(10,65,91,.97),rgba(5,24,57,.95));padding:12px 18px;display:flex;flex-direction:column;justify-content:center}
.need{font-size:18px;font-weight:900}.rrr{margin-top:6px;color:#ffd27a;font-weight:800}
.lower{background:rgba(245,248,252,.98);color:#0a2440;min-height:44px;border-radius:0 0 13px 13px;display:grid;grid-template-columns:1.55fr 1.15fr 1.3fr;align-items:center;gap:12px;padding:0 16px;font-size:13px;font-weight:700}
.balls{display:flex;gap:5px;align-items:center}.ball{min-width:24px;height:24px;border-radius:12px;background:#dfe7ef;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.w{background:#cc2f3f;color:#fff}.bnd{background:#0b6c91;color:#fff}.ext{background:#e7a629}
#error{display:none;background:#7c1d1d;color:#fff;padding:10px 14px;border-radius:9px;margin-bottom:5px}

<script>
const q=new URLSearchParams(location.search),mid=(q.get('match')||'5923').replace(/[^0-9]/g,''),api=`/.netlify/functions/score?match=${mid}`;
function find(o,k){if(!o||typeof o!=='object')return; if(k in o)return o[k];for(const v of Object.values(o)){const f=find(v,k);if(f!==undefined)return f}}
function parse(x){if(typeof x==='object')return x||{};try{return JSON.parse(x||'{}')}catch{return{}}}
function cls(v){let s=String(v).toLowerCase();return s.includes('w')?'ball w':(s==='4'||s==='6')?'ball bnd':/[a-z]/.test(s)?'ball ext':'ball'}
function logoUrl(p){return p?`/.netlify/functions/score?logo=${encodeURIComponent(p)}`:''}
async function load(){try{let r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let p=await r.json(),d=parse(find(p,'score_details')),e=d.extraDetails||find(p,'extraDetails')||{},a=Number(d.activeInnings||find(p,'activeInnings')||1),i1=d.inning1||{},i2=d.inning2||{},inn=d['inning'+a]||{};
team1.textContent=e.team1||i1.teamName||'TEAM 1';team2.textContent=e.team2||i2.teamName||'TEAM 2';score1.textContent=e.team1Score||`${i1.runs||0}/${i1.wickets||0}`;score2.textContent=e.team2Score||`${i2.runs||0}/${i2.wickets||0}`;overs1.textContent=`${e.team1Overs??i1.overs??0} overs`;overs2.textContent=`${e.team2Overs??i2.overs??0} overs`;box1.classList.toggle('active',a===1);box2.classList.toggle('active',a===2);
logo1.src=logoUrl(e.team1Logo||'');logo2.src=logoUrl(e.team2Logo||'');logo1.style.display=e.team1Logo?'block':'none';logo2.style.display=e.team2Logo?'block':'none';
message.textContent=e.message||(a===1?team1.textContent+' batting':team2.textContent+' batting');
let b=[inn.batter1,inn.batter2].filter(x=>x&&x.name).map(x=>`${x.name.replace(/\s+/g,' ')} ${x.run??0}${x.onStrike?'*':''} (${x.ball??0})`);batters.textContent='BATTERS: '+(b.join(' | ')||'—');
let bw=inn.bowler||{};bowler.textContent=bw.name?`BOWLER: ${bw.name.replace(/\s+/g,' ')} ${bw.wicket??0}/${bw.run??0} (${bw.over??0})`:'BOWLER: —';
balls.innerHTML='';(inn.currentRunStack||[]).slice(-10).forEach(v=>{let s=document.createElement('span');s.className=cls(v);s.textContent=String(v).toUpperCase();balls.appendChild(s)});if(!(inn.currentRunStack||[]).length)balls.textContent='—';
let need=Math.max(0,(i1.runs||0)+1-(inn.runs||0));if(a===2){let ov=Number(inn.overs||0),w=Math.floor(ov),bp=Math.round((ov-w)*10),left=Math.max(0,120-(w*6+bp));rrr.textContent=left&&need?`RRR ${(need/(left/6)).toFixed(2)}`:''}else rrr.textContent='';
error.style.display='none'}catch(e){error.style.display='block';error.textContent='Unable to load DCL score: '+e.message}}
load();setInterval(load,4000);
</script></body></html>
